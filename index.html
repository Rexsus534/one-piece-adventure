<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>One Piece Adventure</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="game"></canvas>
<div id="loading"><h1>ONE PIECE ADVENTURE</h1><p id="load-status">Macera hazırlanıyor...</p></div>
<script>
(function(){
  const status=()=>document.getElementById('load-status');
  window.addEventListener('error',function(e){const el=status();if(el)el.textContent='HATA: '+(e.message||'Script yüklenemedi')+' — sayfayı yenile.';});
  window.addEventListener('unhandledrejection',function(e){const el=status();if(el)el.textContent='YÜKLEME HATASI: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason));});
})();
</script>
<div id="hud"><div class="brand">☠ ONE PIECE ADVENTURE</div><div class="stats"><span>SEVİYE <b id="level">1</b></span><span>BELLY <b id="money">100</b></span><span>XP <b id="xp">0</b></span><span>MEYVE <b id="fruitCount">0</b></span></div></div>
<div id="side-ui"><div class="panel"><b>ŞEYTAN MEYVESİ KOLEKSİYONU (GEÇİCİ)</b><div id="fruitInventory">Boş</div></div><div class="panel"><b>FOOSHA VILLAGE GÖREVİ</b><div id="quest">Foosha Village: Shanks ile konuş.</div></div></div>
<div id="message" class="hidden"></div><div id="dialog" class="hidden"><h2 id="npcName">NPC</h2><p id="npcText"></p><button id="closeDialog">KAPAT</button></div>
<div id="controls-help">WASD: Hareket · SHIFT: Koş · E: Konuş / Meyve al · Mouse: Kamera</div>
<div id="joystick"><div id="stick"></div></div><button id="interact">ETKİLEŞ</button><button id="usePower">GÜÇ (F)</button><script type="module" src="./game.js"></script></body></html>
